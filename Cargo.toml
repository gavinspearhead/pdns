[package]
name = "pdns"
version = "1.0.5"
edition = "2024"
authors = ["Gavin Spearhead"]
description = "Passive DNS"
license = "GPL-3.0-only"

[[bin]]
name = "pdns"
path = "src/main.rs"

[[bin]]
name = "dot"
path = "src/dot_main.rs"

[[bin]]
name = "dns_server"
path = "src/dns_server.rs"

[profile.dev]
debug = "full"


[profile.release]
debug = 0
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pcap = { version = "2.4" }
byteorder = "1.5"
chrono = { version = "0.4", features = ["serde"] }
strum =  { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
base64 = "0.23"
sqlx = { version = "0.9", features = [ "mysql", "chrono", "uuid", "tls-native-tls", "runtime-async-std" ] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
data-encoding = "2.11"
regex = "1.12"
publicsuffix="2.3"
log = "0.4"
asn-db2 = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-rfc-5424 = "0.2"
snailquote = "0.3"
idna = "1.1"
serde_with = "3.20"
signal-hook = "0.4"
actix-web = "4.15"
vectorize = "0.2"
parking_lot = "0.12"
zerocopy = "0.8"
flate2 = "1.1"
daemonize-me = "2.0"

# Dependencies for the dependency audit helper binary (not used by main binaries)
rustsec = "0.33"
cargo-lock = "11"
semver = "1.0"
crates_io_api = "0.12"
anyhow = "1.0"
rand = "0.10"
dns-lookup = "3.0"
reqwest = { version = "0.13", features = ["json", "query"] }
native-tls = "0.2"
rustls = {  version = "0.23" , default-features = false }
quinn = "0.11"
tokio = "1.53"
webpki-roots = "1.0.9"
